<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명함</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    overflow: hidden;
}

a {
    display: flex;
    justify-content: center;
    align-items: center;
}

img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    cursor: pointer;
    -webkit-user-drag: none;
    user-select: none;
}
</style>
</head>

<body>

<a href="01.png" download>
    <img src="01.png" alt="namecard">
</a>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>namecard</title>

<style>
body{
    margin:0;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
}

img{
    max-width:90vw;
    max-height:90vh;
    object-fit:contain;
    cursor:pointer;
    -webkit-user-drag:none;
    user-select:none;
}
</style>
</head>
<body>

<a id="downloadLink" download>
    <img id="cardImage" alt="명함">
</a>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id") || "1";

const filename = `p${id}.png`;

document.getElementById("cardImage").src = filename;
document.getElementById("downloadLink").href = filename;
</script>

</body>
</html>
